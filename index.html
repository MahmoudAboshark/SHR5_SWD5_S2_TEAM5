
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Book</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="#" class="logo">Contact<span>Book</span></a>
            <p>Your personal contact manager</p>
        </div>
    </header>

    <main class="container">
        <section class="page-heading">
            <div>
                <h1>My Contacts</h1>
                <p>Manage your contacts in one place.</p>
            </div>
            <button id="showFormBtn" class="btn primary">+ Add Contact</button>
        </section>

        <section id="formSection" class="panel hidden">
            <h2>Add New Contact</h2>

            <form id="contactForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input id="name" name="name" type="text"
                               minlength="2" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email"
                               maxlength="254" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input id="phone" name="phone" type="tel"
                               minlength="7" maxlength="20" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn secondary">
                        Cancel
                    </button>
                    <button type="submit" class="btn primary">
                        Save Contact
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="toolbar">
                <div>
                    <h2>All Contacts</h2>
                    <p id="contactsCount">0 contacts</p>
                </div>
                <input id="searchInput" type="search"
                       placeholder="Search contacts..."
                       aria-label="Search contacts">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody"></tbody>
                </table>
            </div>

            <p id="emptyMessage" class="empty-message hidden">
                No contacts found.
            </p>
        </section>

        <p id="statusMessage" role="status" aria-live="polite"></p>
    </main>

    <footer>
        <p>Contact Book &copy; 2026</p>
    </footer>
</body>
</html>
